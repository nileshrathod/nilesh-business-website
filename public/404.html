<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AASTRA Digital — Redirecting</title>
    <script>
      (function (l) {
        if (l.search && l.search[1] === '/') {
          return;
        }
        var repoPrefix = '/nilesh-business-website';
        var pathSegmentsToKeep =
          l.pathname === repoPrefix || l.pathname.indexOf(repoPrefix + '/') === 0
            ? 1
            : 0;
        var baseSegments = l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');
        var routePath = l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');
        var queryPart = l.search
          ? '&' + l.search.slice(1).replace(/&/g, '~and~')
          : '';
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            baseSegments +
            '/?/' +
            routePath +
            queryPart +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
